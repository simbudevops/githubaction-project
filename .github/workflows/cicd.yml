name: CICD Pipeline

on:
  push:
    branches: [ "master" ]

  workflow_dispatch:

jobs:

# ---------------- BUILD ----------------
  compile:
    runs-on: k8s-deploy

    steps:
    - uses: actions/checkout@v4

    # ---------------- JAVA ----------------
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # ---------------- MAVEN INSTALL ----------------
    - name: Install Maven
      run: |
        if ! command -v mvn &> /dev/null
        then
          echo "Installing Maven..."
          wget https://archive.apache.org/dist/maven/maven-3/3.9.6/binaries/apache-maven-3.9.6-bin.tar.gz
          tar -xzf apache-maven-3.9.6-bin.tar.gz
          sudo mv apache-maven-3.9.6 /opt/maven
          echo "/opt/maven/bin" >> $GITHUB_PATH
        fi

    - name: Verify Java
      run: java -version

    - name: Verify Maven
      run: |
        export PATH=/opt/maven/bin:$PATH
        mvn -version

    - name: Compile Project
      run: |
        export PATH=/opt/maven/bin:$PATH
        mvn compile


# ---------------- SECURITY ----------------
  security-check:
    runs-on: k8s-deploy
    needs: compile

    steps:
    - uses: actions/checkout@v4

    # ---------------- INSTALL TRIVY ----------------
    - name: Install Trivy
      run: |
        if ! command -v trivy &> /dev/null
        then
          echo "Installing Trivy..."
          wget https://github.com/aquasecurity/trivy/releases/latest/download/trivy_0.63.0_Linux-64bit.tar.gz
          tar -xzf trivy_0.63.0_Linux-64bit.tar.gz
          sudo mv trivy /usr/local/bin/
        fi

    - name: Verify Trivy
      run: trivy --version

    - name: Trivy Scan
      run: trivy fs . > trivy-report.txt

    # ---------------- INSTALL GITLEAKS ----------------
    - name: Install Gitleaks
      run: |
        if ! command -v gitleaks &> /dev/null
        then
          echo "Installing Gitleaks..."
          wget https://github.com/gitleaks/gitleaks/releases/download/v8.24.2/gitleaks_8.24.2_linux_x64.tar.gz
          tar -xzf gitleaks_8.24.2_linux_x64.tar.gz
          sudo mv gitleaks /usr/local/bin/
        fi

    - name: Verify Gitleaks
      run: gitleaks version

    - name: Gitleaks Scan
      run: |
        gitleaks detect . \
        -r gitleaks-report.json \
        -f json || true


# ---------------- TEST ----------------
  test:
    runs-on: k8s-deploy
    needs: security-check

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # ---------------- MAVEN INSTALL ----------------
    - name: Install Maven
      run: |
        if ! command -v mvn &> /dev/null
        then
          wget https://archive.apache.org/dist/maven/maven-3/3.9.6/binaries/apache-maven-3.9.6-bin.tar.gz
          tar -xzf apache-maven-3.9.6-bin.tar.gz
          sudo mv apache-maven-3.9.6 /opt/maven
          echo "/opt/maven/bin" >> $GITHUB_PATH
        fi

    - name: Run Tests
      run: |
        export PATH=/opt/maven/bin:$PATH
        mvn test


# ---------------- BUILD + SONAR ----------------
  build_and_sonar:
    runs-on: k8s-deploy
    needs: test

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # ---------------- MAVEN INSTALL ----------------
    - name: Install Maven
      run: |
        if ! command -v mvn &> /dev/null
        then
          wget https://archive.apache.org/dist/maven/maven-3/3.9.6/binaries/apache-maven-3.9.6-bin.tar.gz
          tar -xzf apache-maven-3.9.6-bin.tar.gz
          sudo mv apache-maven-3.9.6 /opt/maven
          echo "/opt/maven/bin" >> $GITHUB_PATH
        fi

    - name: Build Package
      run: |
        export PATH=/opt/maven/bin:$PATH
        mvn clean package

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-jar
        path: target/*.jar

    - name: SonarQube Scan
      uses: SonarSource/sonarqube-scan-action@v5.0.0
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

    - name: Quality Gate Check
      uses: sonarsource/sonarqube-quality-gate-action@master
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}


# ---------------- DOCKER BUILD ----------------
  docker_build_push:
    runs-on: k8s-deploy
    needs: build_and_sonar

    steps:
    - uses: actions/checkout@v4

    - name: Fix Docker Permission
      run: sudo chmod 666 /var/run/docker.sock

    - name: Download Artifact
      uses: actions/download-artifact@v4
      with:
        name: app-jar
        path: app

    - name: Login DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ vars.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build Docker Image
      run: |
        docker build -t simbudevops7497/bankapp:latest .

    - name: Push Docker Image
      run: |
        docker push simbudevops7497/bankapp:latest


# ---------------- KUBERNETES DEPLOY ----------------
  deploy_to_k8s:
    runs-on: k8s-deploy
    needs: docker_build_push

    steps:

    - name: Verify Cluster Access
      run: kubectl get nodes

    # ---------------- DEPLOYMENT ----------------
    - name: Deploy Application
      run: |
        kubectl apply -f - <<EOF
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: bankapp
        spec:
          replicas: 2
          selector:
            matchLabels:
              app: bankapp
          template:
            metadata:
              labels:
                app: bankapp
            spec:
              containers:
              - name: bankapp
                image: simbudevops7497/bankapp:latest
                imagePullPolicy: Always
                ports:
                - containerPort: 8080
        EOF

    # ---------------- SERVICE ----------------
    - name: Create Service
      run: |
        kubectl apply -f - <<EOF
        apiVersion: v1
        kind: Service
        metadata:
          name: bankapp-service
        spec:
          type: NodePort
          selector:
            app: bankapp
          ports:
          - port: 80
            targetPort: 8080
            nodePort: 30080
        EOF

    # ---------------- VERIFY ----------------
    - name: Verify Deployment
      run: |
        kubectl get pods -o wide
        kubectl get svc
        kubectl rollout status deployment/bankapp
