name: CICD Pipeline

on:
  push:
    branches: [ "master" ]


jobs:

# ---------------- BUILD ----------------
  compile:
    runs-on: self-hosted
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Compile Project
      run: mvn compile


# ---------------- SECURITY ----------------
  security-check:
    runs-on: self-hosted
    needs: compile

    steps:
    - uses: actions/checkout@v4

    - name: Install Trivy
      run: |
        sudo apt-get update
        sudo apt-get install -y wget apt-transport-https gnupg lsb-release
        wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
        echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee /etc/apt/sources.list.d/trivy.list
        sudo apt-get update -y
        sudo apt-get install -y trivy

    - name: Trivy Scan
      run: trivy fs --format table -o trivy-report.json .

    - name: Install Gitleaks
      run: sudo apt-get install -y gitleaks

    - name: Gitleaks Scan
      run: gitleaks detect . -r gitleaks-report.json -f json


# ---------------- TEST ----------------
  test:
    runs-on: self-hosted
    needs: security-check

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Run Tests
      run: mvn test


# ---------------- BUILD + SONAR ----------------
  build_and_sonar:
    runs-on: self-hosted
    needs: test

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Build Package
      run: mvn package

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-jar
        path: target/*.jar

    - name: SonarQube Scan
      uses: SonarSource/sonarqube-scan-action@v5.0.0
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

    - name: Quality Gate Check
      uses: sonarsource/sonarqube-quality-gate-action@master
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}


# ---------------- DOCKER BUILD ----------------
  docker_build_push:
    runs-on: self-hosted
    needs: build_and_sonar

    steps:
    - uses: actions/checkout@v4

    - name: Fix Docker permission
      run: sudo chmod 666 /var/run/docker.sock

    - name: Download Artifact
      uses: actions/download-artifact@v4
      with:
        name: app-jar
        path: app

    - name: Login DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ vars.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build & Push Docker Image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: simbudevops7497/bankapp:latest
        file: ./Dockerfile


# ---------------- KUBERNETES DEPLOY (INLINE - NO YAML FILE) ----------------
  deploy_to_k8s:
    runs-on: k8s-deploy
    needs: docker_build_push

    steps:
    - name: Verify cluster access
      run: kubectl get nodes

    # ---------------- CREATE DEPLOYMENT ----------------
    - name: Create Kubernetes Deployment
      run: |
        kubectl apply -f - <<EOF
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: bankapp
        spec:
          replicas: 2
          selector:
            matchLabels:
              app: bankapp
          template:
            metadata:
              labels:
                app: bankapp
            spec:
              containers:
              - name: bankapp
                image: simbudevops7497/bankapp:latest
                imagePullPolicy: Always
                ports:
                - containerPort: 8080
        EOF

    # ---------------- CREATE SERVICE ----------------
    - name: Create Kubernetes Service
      run: |
        kubectl apply -f - <<EOF
        apiVersion: v1
        kind: Service
        metadata:
          name: bankapp-service
        spec:
          type: NodePort
          selector:
            app: bankapp
          ports:
            - port: 80
              targetPort: 8080
              nodePort: 30080
        EOF

    # ---------------- VERIFY ----------------
    - name: Verify Deployment
      run: |
        kubectl get pods
        kubectl get svc
        kubectl rollout status deployment bankapp
