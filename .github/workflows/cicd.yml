name: CICD Pipeline

on:
  push:
    branches:
      - master

  workflow_dispatch:

jobs:

# =========================================================
# BUILD
# =========================================================
  compile:
    runs-on: k8s-deploy

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # ---------------- JAVA ----------------
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ---------------- INSTALL MAVEN ----------------
      - name: Install Maven
        run: |
          if ! command -v mvn &> /dev/null
          then
            echo "Installing Maven..."
            sudo apt-get update
            sudo apt-get install -y maven
          fi

      - name: Verify Java
        run: java -version

      - name: Verify Maven
        run: mvn -version

      - name: Compile Project
        run: mvn compile


# =========================================================
# SECURITY SCAN
# =========================================================
  security-check:
    runs-on: k8s-deploy
    needs: compile

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # ---------------- INSTALL TRIVY ----------------
      - name: Install Trivy
        run: |
          if ! command -v trivy &> /dev/null
          then
            echo "Installing Trivy..."
            wget -qO- https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin
          fi

      - name: Verify Trivy
        run: trivy --version

      - name: Run Trivy Scan
        run: |
          trivy fs . > trivy-report.txt

      # ---------------- INSTALL GITLEAKS ----------------
      - name: Install Gitleaks
        run: |
          if ! command -v gitleaks &> /dev/null
          then
            echo "Installing Gitleaks..."
            GITLEAKS_VERSION=8.24.2

            wget https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz

            tar -xzf gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz

            sudo mv gitleaks /usr/local/bin/
          fi

      - name: Verify Gitleaks
        run: gitleaks version

      - name: Run Gitleaks Scan
        run: |
          gitleaks detect . \
          -r gitleaks-report.json \
          -f json || true


# =========================================================
# TEST
# =========================================================
  test:
    runs-on: k8s-deploy
    needs: security-check

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # ---------------- JAVA ----------------
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ---------------- INSTALL MAVEN ----------------
      - name: Install Maven
        run: |
          if ! command -v mvn &> /dev/null
          then
            sudo apt-get update
            sudo apt-get install -y maven
          fi

      - name: Run Unit Tests
        run: mvn test


# =========================================================
# BUILD + SONARQUBE
# =========================================================
  build_and_sonar:
    runs-on: k8s-deploy
    needs: test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ---------------- JAVA ----------------
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ---------------- INSTALL MAVEN ----------------
      - name: Install Maven
        run: |
          if ! command -v mvn &> /dev/null
          then
            sudo apt-get update
            sudo apt-get install -y maven
          fi

      - name: Build Package
        run: mvn clean package

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar

      # ---------------- SONARQUBE ----------------
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v5.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

      - name: SonarQube Quality Gate
        uses: sonarsource/sonarqube-quality-gate-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}


# =========================================================
# DOCKER BUILD & PUSH
# =========================================================
  docker_build_push:
    runs-on: k8s-deploy
    needs: build_and_sonar

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # ---------------- FIX DOCKER ----------------
      - name: Fix Docker Permissions
        run: |
          sudo chmod 666 /var/run/docker.sock

      - name: Verify Docker
        run: docker --version

      # ---------------- DOWNLOAD JAR ----------------
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: target

      # ---------------- LOGIN DOCKERHUB ----------------
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ---------------- BUILD IMAGE ----------------
      - name: Build Docker Image
        run: |
          docker build -t simbudevops7497/bankapp:latest .

      # ---------------- PUSH IMAGE ----------------
      - name: Push Docker Image
        run: |
          docker push simbudevops7497/bankapp:latest


# =========================================================
# DEPLOY TO KUBERNETES
# =========================================================
  deploy_to_k8s:
    runs-on: k8s-deploy
    needs: docker_build_push

    steps:

      - name: Verify Kubernetes Cluster
        run: |
          kubectl get nodes

      # ---------------- DEPLOYMENT ----------------
      - name: Deploy Application
        run: |
          kubectl apply -f - <<EOF
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: bankapp
          spec:
            replicas: 2
            selector:
              matchLabels:
                app: bankapp
            template:
              metadata:
                labels:
                  app: bankapp
              spec:
                containers:
                - name: bankapp
                  image: simbudevops7497/bankapp:latest
                  imagePullPolicy: Always
                  ports:
                  - containerPort: 8080
          EOF

      # ---------------- SERVICE ----------------
      - name: Create Service
        run: |
          kubectl apply -f - <<EOF
          apiVersion: v1
          kind: Service
          metadata:
            name: bankapp-service
          spec:
            type: NodePort
            selector:
              app: bankapp
            ports:
            - port: 80
              targetPort: 8080
              nodePort: 30080
          EOF

      # ---------------- VERIFY ----------------
      - name: Verify Deployment
        run: |
          kubectl get pods -o wide
          kubectl get svc
          kubectl rollout status deployment/bankapp
